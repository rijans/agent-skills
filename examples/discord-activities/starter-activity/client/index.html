<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Discord Activity Starter</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #2b2d31;
      color: #f2f3f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      background: #1e1f22;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      text-align: center;
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 12px;
      border: 3px solid #5865f2;
    }
    h1 {
      font-size: 20px;
      margin: 0 0 8px 0;
    }
    p {
      color: #949ba4;
      font-size: 14px;
      margin: 0 0 16px 0;
    }
    .badge {
      display: inline-block;
      background: #23a55a;
      color: white;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
    }
    .btn {
      background: #5865f2;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      transition: background 0.15s;
    }
    .btn:hover {
      background: #4752c4;
    }
  </style>
</head>
<body>
  <div class="card">
    <img id="avatar" class="avatar" src="https://cdn.discordapp.com/embed/avatars/0.png" alt="Avatar" />
    <h1 id="username">Connecting to Discord...</h1>
    <p id="channel-info">Channel: Loading...</p>
    <div><span class="badge" id="status-badge">Connecting RPC</span></div>
    <button class="btn" id="ping-btn">Ping Activity</button>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
